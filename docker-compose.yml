x-app-env: &app-env
  - DATABASE_URL=postgresql+psycopg://knowmate:knowmate@postgres:5432/knowmate
  - REDIS_URL=redis://redis:6379/0
  - CELERY_BROKER_URL=redis://redis:6379/0
  - CELERY_RESULT_BACKEND=redis://redis:6379/1
  - QDRANT_HOST=qdrant
  - QDRANT_PORT=6333
  - UPLOAD_DIR=/app/storage/uploads

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-env
  volumes:
    - .:/app
  restart: unless-stopped

services:
  postgres:
    image: paradedb/paradedb:v0.24.3-pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron"]
    environment:
      POSTGRES_DB: knowmate
      POSTGRES_USER: knowmate
      POSTGRES_PASSWORD: knowmate
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowmate -d knowmate"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *app-service
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *app-service
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --pool=solo --hostname=worker@%h
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d worker@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  qdrant-data:
